<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML シューティングゲーム</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>HTMLシューティングゲーム</h1>
    <p>矢印キーで移動、スペースキーで弾を発射</p>
    <div class="game-board">
      <canvas id="gameCanvas" width="480" height="640"></canvas>
      <div class="overlay">
        <div id="scoreDisplay">スコア: 0</div>
        <div id="message" class="hidden">ゲームオーバー<br/><button id="restartButton">再スタート</button></div>
      </div>
    </div>
    <p class="tips">敵を全滅させてハイスコアを目指そう！</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
